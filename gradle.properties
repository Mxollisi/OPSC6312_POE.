# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Memory settings.
# The previous build crashed with "Insufficient system resources" / "Out of memory"
# because Gradle (3 GB) + a separate Kotlin daemon were both reserving large heaps.
# A smaller Gradle heap with the Kotlin compiler running inside it uses far less RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Kotlin & Android settings
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
